# ============================================================
# MES backend i18n messages - English (en)
# Base language: messages_zh_CN.properties (keys MUST match exactly, see docs/modules/i18n.md)
#
# Naming convention:
#   mes.error.*  framework / error codes (ErrorCode.codeKey) + exception handler details
#   mes.biz.*    cross-module business messages (referenced by BusinessException.ofKey)
# Placeholders: MessageFormat style {0} {1}... (single quotes must be escaped as '')
# Fallback: missing keys here fall back to the zh_CN base bundle (MesMessages)
# ============================================================

# ================= mes.error.* framework (ErrorCode enum) =================
mes.error.success=Operation succeeded
mes.error.bad-request=Invalid request parameters
mes.error.unauthorized=Not signed in or session has expired
mes.error.forbidden=Access denied
mes.error.not-found=Resource not found
mes.error.method-not-allowed=HTTP method not supported
mes.error.internal-error=Internal server error
mes.error.service-unavailable=Service temporarily unavailable
mes.error.business-error=Business processing failed
mes.error.duplicate-data=Data already exists; please do not resubmit
mes.error.data-not-exists=Data does not exist or has been deleted
mes.error.data-in-use=Data is referenced by other records and cannot be deleted

# ---- Exception handler details (parameterized) ----
# {0} = joined field validation errors
mes.error.validation-failed=Request validation failed: {0}
# {0} = parameter name
mes.error.missing-param=Missing required parameter: {0}
# {0} = parameter name
mes.error.type-mismatch=Parameter type mismatch: {0}
# {0} = request path
mes.error.not-found-detail=Endpoint not found: {0}

# ================= mes.biz.* common business messages =================

# ---- Auth / permission ----
mes.biz.login-failed=Incorrect username or password
# {0} = retry hint
mes.biz.account-locked=Account locked due to too many failed attempts; please retry after {0}
mes.biz.account-disabled=Account has been disabled; please contact the administrator
mes.biz.permission-denied=Insufficient permission
mes.biz.not-logged-in=Not signed in or session has expired

# ---- Common data ----
mes.biz.data-not-exists=Data does not exist
mes.biz.data-exists=Data already exists; please do not resubmit
mes.biz.duplicate-submit=Duplicate submission is not allowed
mes.biz.data-in-use=Data is referenced by other records and cannot be deleted
# {0} = code value
mes.biz.code-exists=Code already exists: {0}
# {0} = name value
mes.biz.name-exists=Name already exists: {0}
mes.biz.concurrent-conflict=Concurrent conflict; please refresh and try again
mes.biz.save-failed=Failed to save

# ---- Documents ----
# {0} = document no or id
mes.biz.doc-not-exists=Document does not exist: {0}
# {0} = document no
mes.biz.doc-audited=Document [{0}] has already been approved; do not approve again
# {0} = document no
mes.biz.doc-not-audited=Document [{0}] is not approved; please approve it first
# {0} = document no
mes.biz.doc-posted=Document [{0}] has been approved and posted; modification or deletion is not allowed
mes.biz.doc-no-lines=The document has no detail lines and cannot be approved
mes.biz.status-not-allowed=The current status does not allow this operation
# {0} = accounting period
mes.biz.period-closed=Period [{0}] has been closed; no changes are allowed

# ---- Inventory ----
# {0} = warehouse, {1} = material, {2} = quantity detail
mes.biz.stock-not-enough=Insufficient stock: warehouse [{0}] material [{1}], on-hand quantity cannot satisfy {2}
# {0} = warehouse, {1} = material, {2} = batch
mes.biz.batch-stock-not-enough=Insufficient stock of the specified batch: warehouse [{0}] material [{1}] batch [{2}]
mes.biz.qty-positive=Quantity must be greater than 0
mes.biz.same-warehouse=Transfer-out warehouse and transfer-in warehouse cannot be the same
# {0} = material
mes.biz.batch-required=Material [{0}] has batch management enabled; a batch number is required
# {0} = material
mes.biz.batch-not-allowed=Material [{0}] does not have batch management enabled; batch issue is not allowed

# ---- Common operations ----
mes.biz.too-frequent=Too many requests; please try again later
mes.biz.export-failed=Export failed
mes.biz.import-format-error=Import failed: invalid file format
mes.biz.already-disabled=The record is disabled; operation is not allowed
