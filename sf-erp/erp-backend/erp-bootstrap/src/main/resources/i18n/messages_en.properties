# ============================================================
# ERP backend i18n messages - English (en)
# Base language: messages_zh_CN.properties (keys MUST match exactly, see docs/modules/i18n.md)
#
# Naming convention:
#   erp.error.*  framework / error codes (ErrorCode.codeKey) + exception handler details
#   erp.biz.*    cross-module business messages (referenced by BusinessException.ofKey)
# Placeholders: MessageFormat style {0} {1}... (single quotes must be escaped as '')
# Fallback: missing keys here fall back to the zh_CN base bundle (ErpMessages)
# ============================================================

# ================= erp.error.* framework (ErrorCode enum) =================
erp.error.success=Operation succeeded
erp.error.bad-request=Invalid request parameters
erp.error.unauthorized=Not signed in or session has expired
erp.error.forbidden=Access denied
erp.error.not-found=Resource not found
erp.error.method-not-allowed=HTTP method not supported
erp.error.internal-error=Internal server error
erp.error.service-unavailable=Service temporarily unavailable
erp.error.business-error=Business processing failed
erp.error.duplicate-data=Data already exists; please do not resubmit
erp.error.data-not-exists=Data does not exist or has been deleted
erp.error.data-in-use=Data is referenced by other records and cannot be deleted

# ---- Exception handler details (parameterized) ----
# {0} = joined field validation errors
erp.error.validation-failed=Request validation failed: {0}
# {0} = parameter name
erp.error.missing-param=Missing required parameter: {0}
# {0} = parameter name
erp.error.type-mismatch=Parameter type mismatch: {0}
# {0} = request path
erp.error.not-found-detail=Endpoint not found: {0}

