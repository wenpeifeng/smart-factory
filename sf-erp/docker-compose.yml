# ERP 项目数据库环境（MySQL 8 + Redis 7）
# 说明：数据通过 docker volume 持久化，容器删除后数据仍在。
# 注意：日常启动请用 ./script/sh/start-all.sh（内部由 env-init.sh 管理容器，
#       运行中/已停止/不存在三种状态自动处理）；本文件仅作全新环境的兜底创建，
#       若同名容器已存在，docker compose up 会冲突报错。

services:
  mysql:
    image: mysql:8
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: erp123456
      MYSQL_DATABASE: erp_db
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - erp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-perp123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass erp123456
    ports:
      - "6379:6379"
    volumes:
      - erp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "erp123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  erp-mysql-data:
    name: erp-mysql-data   # 复用 docker run 创建的同名卷，保证数据一致
    external: true
  erp-redis-data:
    name: erp-redis-data
    external: true
