# ============================================================
# ERP 后端国际化文案 —— 中文（zh_CN，基准语言）
# 英文版：messages_en.properties（两文件 key 必须完全一致，见 docs/modules/i18n.md）
#
# 命名规范：
#   erp.error.*  框架层/错误码（ErrorCode.codeKey）+ 异常处理器明细文案
#   erp.biz.*    跨模块高频业务提示（BusinessException.ofKey 引用）
# 占位符：MessageFormat 风格 {0} {1}...（英文文件中出现英文单引号需写成 ''）
# 兜底：英文缺 key 时自动回退本文件（ErpMessages），永不向前端返回 key 原样
# ============================================================

# ================= erp.error.* 框架层（ErrorCode 枚举） =================
erp.error.success=操作成功
erp.error.bad-request=请求参数错误
erp.error.unauthorized=未登录或登录已过期
erp.error.forbidden=没有访问权限
erp.error.not-found=资源不存在
erp.error.method-not-allowed=请求方式不支持
erp.error.internal-error=系统内部异常
erp.error.service-unavailable=服务暂不可用
erp.error.business-error=业务处理失败
erp.error.duplicate-data=数据已存在，请勿重复提交
erp.error.data-not-exists=数据不存在或已被删除
erp.error.data-in-use=数据被引用，无法删除

# ---- 异常处理器明细（带参数） ----
